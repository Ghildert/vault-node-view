<section class="nodevault-bubble-view">
  <div class="tw-flex tw-items-center tw-gap-2 tw-pb-3">
    <div class="nodevault-search">
      <bit-search
        #search
        placeholder="Search logins or type @ for a specifier"
        autocomplete="off"
        [ngModel]="searchQuery()"
        (ngModelChange)="updateSearch($event)"
        (focusin)="updateSuggestions()"
        (focusout)="closeSuggestions()"
        (click)="updateSuggestions()"
        (keyup.arrowleft)="updateSuggestions()"
        (keyup.arrowright)="updateSuggestions()"
      />
      @if (suggestions()?.options?.length) {
        <div
          id="nodevault-search-options"
          class="nodevault-search-options"
          role="listbox"
          aria-label="Search specifiers"
        >
          @for (option of suggestions()!.options; track option; let index = $index) {
            <div
              role="option"
              [id]="'nodevault-search-option-' + index"
              [attr.aria-selected]="index === activeSuggestion()"
              (mousedown)="$event.preventDefault()"
              (mouseenter)="activeSuggestion.set(index)"
              (click)="acceptSuggestion(option)"
            >
              {{ option }}
            </div>
          }
          <p>↑ ↓ to select · Tab or Enter to insert</p>
        </div>
      }
    </div>
    <button bitButton buttonType="secondary" type="button" (click)="toggleShape()">
      {{ rounded() ? "Rounded" : "Circles" }}
    </button>
    <button
      bitButton
      buttonType="secondary"
      type="button"
      class="nodevault-settings-trigger"
      popovertarget="nodevault-settings"
    >
      Settings
    </button>
  </div>
  <div
    id="nodevault-settings"
    class="nodevault-settings"
    popover
    role="dialog"
    aria-label="Node view settings"
  >
    <label class="nodevault-label-setting">
      Characters before ellipsis
      <input
        #length
        type="number"
        min="1"
        [max]="maxLabelLength"
        required
        [value]="labelLength()"
        (change)="updateLabelLength(length)"
      />
    </label>
  </div>
  <div class="tw-relative tw-flex tw-min-h-0 tw-flex-1">
    <div
      class="nodevault-canvas"
      #canvas
      tabindex="0"
      role="group"
      aria-label="Vault bubble canvas"
    >
      <p class="nodevault-hint">
        Drag to rearrange. Pull past an outline, then drop on another folder to move. Drag the
        background to pan, scroll to zoom.
      </p>
    </div>
    <div class="tw-absolute tw-bottom-3 tw-end-3 tw-flex tw-gap-1">
      <button
        type="button"
        bitIconButton="bwi-subtract"
        buttonType="secondary"
        size="small"
        [label]="'zoomOut' | i18n"
        (click)="engine()?.zoomBy(0.8)"
      ></button>
      <button
        type="button"
        bitIconButton="bwi-target-system"
        buttonType="secondary"
        size="small"
        label="Fit graph"
        (click)="engine()?.fit()"
      ></button>
      <button
        type="button"
        bitIconButton="bwi-plus"
        buttonType="secondary"
        size="small"
        [label]="'zoomIn' | i18n"
        (click)="engine()?.zoomBy(1.25)"
      ></button>
    </div>
  </div>
</section>
