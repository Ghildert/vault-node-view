<div
  class="vault tw-flex tw-flex-col tw-h-full tw-overflow-x-hidden"
  attr.aria-hidden="{{ showingModal }}"
>
  <vault-organization-user-notifications
    class="tw-shrink-0"
  ></vault-organization-user-notifications>
  <div [ngClass]="vfo1Foundation() ? 'tw-px-8' : 'tw-pt-6 tw-px-6'">
    <ng-template #viewToggle>
      <button
        type="button"
        class="tw-cursor-pointer tw-border-0 tw-bg-transparent tw-p-0 tw-text-[color:inherit] [font:inherit] hover:tw-underline focus-visible:tw-underline"
        [attr.aria-label]="
          showBubbleView() ? 'Node view. Switch to Vault' : 'Vault view. Switch to Node'
        "
        [title]="showBubbleView() ? 'Switch to Vault' : 'Switch to Node'"
        (click)="showBubbleView.set(!showBubbleView())"
      >
        {{ showBubbleView() ? "Node" : "Vault" }}
      </button>
    </ng-template>
    <app-header
      [title]="title()"
      [titleTemplate]="canShowBubbleView() && showViewToggleInTitle() ? viewToggle : undefined"
    >
      @if (showBreadcrumbs()) {
        <vault-breadcrumbs slot="breadcrumbs" [scope]="vaultScope()" />
      } @else if (headerTile(); as tile) {
        <bit-icon-tile
          slot="title-prefix"
          [icon]="tile.icon"
          [variant]="tile.variant ?? 'primary'"
          [color]="tile.color"
          [emphasis]="tile.emphasis ?? 'subtle'"
          size="sm"
          aria-hidden="true"
        />
      }
      @if (canShowBubbleView() && !showViewToggleInTitle()) {
        <span slot="title-suffix" class="tw-ml-2">
          <ng-container *ngTemplateOutlet="viewToggle"></ng-container>
        </span>
      }
      @if (!vfo1Foundation()) {
        <vault-new-cipher-menu
          [canCreateCipher]="(canCreateCipher$ | async) ?? true"
          [canCreateFolder]="true"
          [canCreateSshKey]="true"
          [disabled]="!((canCreateCipher$ | async) ?? true)"
          (cipherAdded)="addCipher($event)"
          (folderAdded)="addFolder()"
          (onAddItemDialog)="openAddItemDialog()"
        />
      }
    </app-header>
  </div>
  @if (showBubbleView() && canShowBubbleView()) {
    <app-nodevault-bubble-view
      class="tw-flex tw-flex-1 tw-min-h-0"
      [folders]="folders()"
      [items]="bubbleItems()"
      [searchDocuments]="bubbleSearchDocuments()"
      [selectedItemId]="bubbleDrawerItemId()"
      (openItem)="openBubbleItem($event)"
      (moveItems)="moveBubbleItems($event)"
    />
  } @else if (vfo1Foundation()) {
    <!--
      Padded to the page gutters rather than the table's own container, so it lines up with the
      header above it. Renders nothing outside a shared folder, leaving no gap in its place.

      Kept at its natural height: the grid is uncapped — its accordion is `height="auto"`, so
      "Show all" grows it without bound — and shrinking it would clip cards. The table below
      absorbs the space it takes instead, down to its own floor (MIN_TABLE_HEIGHT), past which the
      page scrolls.
    -->
    <vault-shared-folder-card-grid
      class="tw-block tw-shrink-0 tw-px-8"
      [collections]="scopedCollections"
      [scope]="vaultScope()"
    ></vault-shared-folder-card-grid>
    <!-- Remounted per scope: the table reads its filters from the URL once, at mount. -->
    <app-vault-list-table
      *vaultRemountOn="filterScopeKey()"
      class="tw-flex-1 tw-min-h-0"
      [ciphers]="ciphers"
      [folders]="folders()"
      [collections]="scopedCollections"
      [allCollections]="allCollections"
      [scopedOrganizationId]="(selectedOrganization$ | async)?.id"
      [organizations]="scopedOrganizations"
      [orgRequiresDataOwnership]="(enforceOrgDataOwnershipPolicy$ | async) ?? false"
      [loading]="refreshing || performingInitialLoad"
      [canCreateCipher]="(canCreateCipher$ | async) ?? true"
      [showAddCipherBtn]="(showAddCipherBtn$ | async) ?? true"
      [scope]="vaultScope()"
      [organizationName]="emptyVaultOrganizationName()"
      [defaultCollectionId]="defaultCollectionId()"
      [sharedFolderName]="emptySharedFolderName"
      [hasMultipleVaults]="hasMultipleVaults()"
      [myVaultItemCount]="myVaultItemCount()"
      (onEvent)="onVaultItemsEvent($event)"
      (onAddCipher)="addCipher($event)"
      (onAddFolder)="addFolder()"
      (onAddItemDialog)="openAddItemDialog()"
      (onImport)="openImport()"
    />
  } @else {
    <bit-search
      class="tw-mb-4 tw-px-6"
      [ngModel]="currentSearchText$ | async"
      (ngModelChange)="filterSearchText($event)"
      [placeholder]="searchPlaceholderText()"
      appAutofocus
    />
    <app-vault-list
      class="tw-h-full"
      [ciphers]="ciphers"
      [collections]="collectionsToDisplay"
      [allCollections]="allCollections"
      [allOrganizations]="allOrganizations"
      [disabled]="refreshing"
      [showOwner]="true"
      [userCanArchive]="userCanArchive$ | async"
      [enforceOrgDataOwnershipPolicy]="enforceOrgDataOwnershipPolicy$ | async"
      [placeholderText]="searchPlaceholderText()"
      [isEmpty]="isEmpty && !performingInitialLoad"
      [showAddCipherBtn]="showAddCipherBtn$ | async"
      [emptyStateItem]="emptyState$ | async"
      [showPremiumCallout]="showPremiumCallout$ | async"
      (onEvent)="onVaultItemsEvent($event)"
      (onAddCipher)="addCipher($event)"
      (onAddFolder)="addFolder()"
      (onAddItemDialog)="openAddItemDialog()"
    />
  }
  <bit-vault-batch-action />
</div>
